<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2c3e50" />
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body.auth-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        background: #f4f6f9;
      }
      .auth-card {
        width: min(100%, 420px);
        padding: 32px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 28px rgba(28, 45, 64, 0.12);
      }
      .auth-card h1 {
        margin: 0 0 8px;
        color: #2c3e50;
        font-size: 26px;
      }
      .auth-intro {
        margin: 0 0 24px;
        color: #667085;
        line-height: 1.5;
      }
      .auth-form {
        display: grid;
        gap: 15px;
      }
      .auth-form label {
        display: grid;
        gap: 7px;
        color: #344054;
        font-size: 14px;
        font-weight: 600;
      }
      .auth-form input {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #d0d5dd;
        border-radius: 7px;
        font: inherit;
      }
      .auth-form input:focus {
        outline: 2px solid #9bb4cf;
        border-color: #2c3e50;
      }
      .auth-button {
        min-height: 45px;
        padding: 11px 14px;
        border: 0;
        border-radius: 7px;
        background: #2c3e50;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .auth-button:hover {
        background: #223246;
      }
      .auth-button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      .auth-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 18px 0;
        color: #98a2b3;
        font-size: 13px;
      }
      .auth-divider::before,
      .auth-divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: #eaecf0;
      }
      .google-button {
        width: 100%;
        min-height: 44px;
        border: 1px solid #d0d5dd;
        border-radius: 7px;
        background: white;
        color: #344054;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .auth-message {
        min-height: 20px;
        margin: 12px 0 0;
        color: #b42318;
        font-size: 14px;
        line-height: 1.4;
      }
      .auth-footer {
        margin: 18px 0 0;
        color: #667085;
        text-align: center;
        font-size: 14px;
      }
      .auth-footer a {
        position: static;
        display: inline-block;
        width: auto;
        left: auto;
        bottom: auto;
        padding: 8px 14px;
        border: 1px solid #2c3e50;
        border-radius: 7px;
        background: #fff;
        color: #2c3e50;
        font-weight: 700;
        text-decoration: none;
      }
      .auth-footer a:hover {
        background: #eef2f6;
      }
      @media (max-width: 480px) {
        .auth-card {
          padding: 25px 20px;
        }
      }
    </style>
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <h1>Admin Login</h1>
      <p class="auth-intro">Sign in to continue to your dashboard.</p>
      <form class="auth-form" id="loginForm">
        <label for="email"
          >Email
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
          />
        </label>
        <label for="password"
          >Password
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>
        <button class="auth-button" id="loginButton" type="submit">
          Continue
        </button>
      </form>
      <p
        class="auth-message"
        id="authMessage"
        role="status"
        aria-live="polite"
      ></p>
      <div class="auth-divider">or</div>
      <button class="google-button" id="googleButton" type="button">
        Continue With Google
      </button>
      <p class="auth-footer">
        Need an account? <a href="signup.html">Sign up</a>
      </p>
    </main>
    <script type="module" src="login.js"></script>
  </body>
</html>
